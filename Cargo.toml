[package]
name = "modelmux"
version = "0.1.0"
edition = "2021"
description = "Rule-based LLM routing proxy: one OpenAI-compatible endpoint, many backends"
license = "MIT"

[lib]
name = "modelmux"
path = "src/lib.rs"

[[bin]]
name = "modelmux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
# tower::ServiceExt::oneshot for the layer-ordering contract test.
# Same major as axum's own tower, so it unifies.
tower = { version = "0.5", features = ["util"] }
